[project]
name = "autonex-api"
version = "1.0.0"
description = "AUTONEX AI independent automotive orchestration platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3",
  "langchain-core>=1,<2",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
  "langchain-text-splitters>=1,<2",
  "mcp>=2,<3",
  "numpy>=2,<3",
  "sqlalchemy>=2.1.8",
  "alembic>=1.20.1",
  "psycopg[binary]>=3.3.8",
  "pgvector>=0.5.1",
  "reportlab>=5.1.0",
  "opentelemetry-api>=1.45.2",
  "opentelemetry-sdk>=1.45.2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["reportlab.*", "pgvector.*"]
ignore_missing_imports = true
